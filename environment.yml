name: openmm_dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  - rdkit
  - pytorch
  - libtorch=2.10.0[build=cuda129*]
  - openmm-torch
  - triton=3.6.0[build=cuda129*]
  - cuda-version=12.9
  - cuda-nvcc=12.9
  - cuda-cudart-dev=12.9
  - cuda-driver-dev=12.9
  - libcudnn=9.1
  - nccl[version='>=2.20']
  - openmm-ml
  - pymbar-core=4.2.0
  - openmm
  # PLAN_openmm_8_6_remd_backend.md §3 实施要求 1：REMD 后端选择必须用
  # packaging.version 做语义版本比较（字符串序下 '8.10.0' < '8.6.0'）。
  # 它通常作为 setuptools 的传递依赖存在，但显式声明才不会哪天被优化掉。
  - packaging
  - pdbfixer
prefix: /home/canna/miniforge3/envs/openmm_dev
