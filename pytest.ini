[pytest]
# 统一测试入口（ATT-22 / #62）。
#
# ⚠️ 这份配置**必须放在仓库根目录**，不能放在 `tests/` 里。
#
# 2026-07-30 修：它原来在 `tests/pytest.ini`，而正式入口
# `tests/run_offline_tests.sh` 是 `cd $REPO_ROOT` 之后不带任何路径参数跑
# `python -m pytest`。pytest 的配置发现是从 **cwd 向上**逐级找
# pytest.ini / pyproject.toml / setup.cfg / tox.ini——`tests/` 在 cwd **之下**，
# 永远不会被搜到。根目录当时又没有任何其它 pytest 可识别的配置文件，
# 结果这份 ini 对正式入口命令**整体静默失效**：
#
#   - `markers` 没注册 → 每条测试都报
#     `PytestUnknownMarkWarning: Unknown pytest.mark.cpu_only`；
#   - `addopts = -ra` 没生效 → 跳过/失败原因不再汇总，
#     "importorskip 静默跳过一批却显示 all passed" 这个失败模式又回来了；
#   - `filterwarnings`、`testpaths`、`norecursedirs` 同样没生效。
#
# 只有 `./tests/run_offline_tests.sh tests/test_x.py` 这种**带路径参数**的调用
# 才会从 `tests/` 往上走、恰好命中旧位置——所以同一个脚本两种用法行为不一致，
# 而不一致的那一半正是日常最常用的全量 pre-flight。
#
# 放在根目录后两种用法都会命中同一份配置。**不要**再在 `tests/` 下放一份副本：
# 两份都存在时，带路径参数的调用会优先命中 `tests/` 那份并把 rootdir 定成
# `tests/`，`testpaths = tests` 就会被解释成 `tests/tests`。

testpaths = tests
python_files = test_*.py

# 只在 tests/ 收集测试。output*/tmp/docs 等目录里有大量运行产物和参考资料，
# 递归进去纯属浪费（NFS 上尤其慢），而且 .pycache_check/ 之类目录里可能有旧的
# 同名 .py 副本，收进来会产生 import 冲突。
norecursedirs =
    .git
    .claude
    .codex
    .agents
    .pytest_cache
    .pycache_check
    .rocklin_review_check
    .rocklin_smoke
    __pycache__
    output
    output_lrc_fix
    rocklin_smoke_test
    docs
    tmp
    integrated-boltzmann-sampling
    a-relative-binding-free-energy-framework-for-structurally-dissimilar-molecules.MD

markers =
    cpu_only: 只需 CPU（OpenMM Reference/CPU platform 即可），可在登录节点跑
    needs_gpu: 需要 CUDA 设备，必须提交到 GPU 节点

# -ra 让跳过/失败的原因在末尾汇总列出——importorskip 静默跳过一批测试却显示
# "all passed" 是最容易自欺的失败模式。
addopts = -ra

filterwarnings =
    default
