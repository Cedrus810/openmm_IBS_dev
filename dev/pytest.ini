[pytest]
# 统一测试入口（ATT-22 / #62 的最小一步）。此前根目录没有任何 pytest 配置，
# 测试文件混用 unittest.TestCase 与 pytest 函数风格，且没有办法只挑"不需要 GPU
# 的"跑，也没有一条固定的 pre-flight 命令。

testpaths = .
python_files = test_*.py

# 只在仓库根目录收集测试。output*/tmp/docs 等目录里有大量运行产物和参考资料，
# 递归进去纯属浪费（NFS 上尤其慢），而且 .pycache_check/ 之类目录里可能有旧的
# 同名 .py 副本，收进来会产生 import 冲突。
norecursedirs =
    .git
    .claude
    .codex
    .agents
    .pytest_cache
    .pycache_check
    .rocklin_review_check
    .rocklin_smoke
    __pycache__
    output
    output_lrc_fix
    rocklin_smoke_test
    docs
    tmp
    integrated-boltzmann-sampling
    a-relative-binding-free-energy-framework-for-structurally-dissimilar-molecules.MD

markers =
    cpu_only: 只需 CPU（OpenMM Reference/CPU platform 即可），可在登录节点跑
    needs_gpu: 需要 CUDA 设备，必须提交到 GPU 节点

# -ra 让跳过/失败的原因在末尾汇总列出——importorskip 静默跳过一批测试却显示
# "all passed" 是最容易自欺的失败模式。
addopts = -ra

filterwarnings =
    default
